<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>寵物小學堂 · 維運後台</title>
<style>
  body { font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif; background: #F4EFE6; color: #4A3B2C; margin: 0; padding: 24px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  .hint { color: #8A7A64; font-size: 13px; margin: 0 0 20px; }
  .card { background: #FFF; border-radius: 16px; padding: 20px 24px; margin-bottom: 20px; box-shadow: 0 2px 10px rgba(90,60,30,0.08); max-width: 720px; }
  label { display: block; font-size: 13px; margin: 10px 0 4px; }
  input[type="text"], input[type="email"], input[type="password"] {
    font-size: 15px; padding: 8px 10px; border: 1px solid #DDD0BC; border-radius: 8px; width: 240px; box-sizing: border-box;
  }
  button { font-size: 14px; padding: 8px 16px; border: none; border-radius: 8px; background: #F2B96B; color: #FFF; cursor: pointer; margin-top: 10px; }
  button.ghost { background: #F2E8D8; color: #8A6242; }
  .err { color: #C25858; font-size: 13px; min-height: 18px; margin-top: 8px; }
  .counts { display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 16px; }
  .counts b { font-size: 22px; display: block; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #EFE4D4; }
  #dashboard-view { display: none; }
  .top-row { display: flex; justify-content: space-between; align-items: center; }
  #lookup-result p { margin: 4px 0; font-size: 14px; }
</style>
</head>
<body>
<h1>寵物小學堂 · 維運後台</h1>
<p class="hint">僅供管理員使用。不列出關卡/答題等學習細節;查詢還原碼時也不讀取實際備份內容,只做代碼轉交。</p>

<div id="login-view" class="card">
  <label for="login-email">Email</label>
  <input type="email" id="login-email">
  <label for="login-pw">密碼</label>
  <input type="password" id="login-pw">
  <div><button id="login-btn">登入</button></div>
  <div class="err" id="login-err"></div>
</div>

<div id="dashboard-view">
  <div class="card top-row">
    <span>登入身份:<b id="who"></b></span>
    <button class="ghost" id="logout-btn">登出</button>
  </div>

  <div class="card">
    <h2>使用狀況總覽</h2>
    <div class="counts" id="counts-row"></div>
    <div class="err" id="overview-err"></div>
    <table>
      <thead><tr><th>小朋友暱稱</th><th>寵物種類</th><th>好友代碼</th><th>最後同步</th></tr></thead>
      <tbody id="activity-body"></tbody>
    </table>
  </div>

  <div class="card">
    <h2>查詢還原碼(協助家長救回進度)</h2>
    <p class="hint" style="margin:0 0 8px">輸入小朋友的好友代碼,查到還原碼後轉交給家長,由家長自己在 App 的家長區操作還原。這裡只顯示還原碼,不讀取實際進度內容。</p>
    <label for="lookup-code">好友代碼</label>
    <input type="text" id="lookup-code" maxlength="6" placeholder="好友代碼" style="text-transform:uppercase">
    <div><button id="lookup-btn">查詢</button></div>
    <div class="err" id="lookup-err"></div>
    <div id="lookup-result"></div>
  </div>
</div>

<script src="app/config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="app/admin.js"></script>
</body>
</html>
